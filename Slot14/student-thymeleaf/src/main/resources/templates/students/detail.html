<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Chi tiết sinh viên</title>
</head>
<body>
<section layout:fragment="content">
    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center bg-light">
            <h4 class="mb-0" th:text="|${student.studentCode} - ${student.fullName}|">SE180001 - Nguyễn Văn A</h4>
            <span class="badge"
                  th:classappend="${student.active} ? 'text-bg-success' : 'text-bg-secondary'"
                  th:text="${student.active} ? 'Đang học' : 'Bảo lưu'">Đang học</span>
        </div>
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3 text-muted">Mã sinh viên</dt>
                <dd class="col-sm-9 fw-bold" th:text="${student.studentCode}">SE180001</dd>

                <dt class="col-sm-3 text-muted">Họ tên</dt>
                <dd class="col-sm-9" th:text="${student.fullName}">Nguyễn Văn A</dd>

                <dt class="col-sm-3 text-muted">Email</dt>
                <dd class="col-sm-9">
                    <a th:href="|mailto:${student.email}|"
                       th:text="${student.email} ?: 'Chưa cập nhật'">a@fpt.edu.vn</a>
                </dd>

                <dt class="col-sm-3 text-muted">Ngày sinh</dt>
                <dd class="col-sm-9"
                    th:text="|${#temporals.format(student.dateOfBirth, 'dd/MM/yyyy')} (${student.age} tuổi)|">
                    01/01/2004 (22 tuổi)
                </dd>

                <dt class="col-sm-3 text-muted">Ngành</dt>
                <dd class="col-sm-9"
                    th:text="${student.major} + ' - ' + (${majors[student.major]} ?: 'Không xác định')">
                    SE - Kỹ thuật phần mềm
                </dd>

                <dt class="col-sm-3 text-muted">GPA</dt>
                <dd class="col-sm-9 fw-bold" th:text="${#numbers.formatDecimal(student.gpa, 1, 2)} + ' / 10'">8.00 / 10</dd>

                <!-- [CÂU 4]: Tái sử dụng fragment rank(rank) trong trang chi tiết -->
                <dt class="col-sm-3 text-muted">Xếp loại</dt>
                <dd class="col-sm-9">
                    <th:block th:replace="~{fragments/badges :: rank(${student.rank})}"></th:block>
                </dd>

                <dt class="col-sm-3 text-muted">Học bổng</dt>
                <dd class="col-sm-9"
                    th:text="${student.gpa ge 8.0 and student.active}
                             ? 'Đủ điều kiện xét học bổng' : 'Không đủ điều kiện'">
                    Đủ điều kiện xét học bổng
                </dd>
            </dl>

            <hr>
            <div th:object="${student}" class="small text-muted">
                <span>Selection expression (*{...}) &rarr; </span>
                <span class="fw-semibold" th:text="*{fullName}">Nguyễn Văn A</span> &ndash;
                <span th:text="*{email}">a@fpt.edu.vn</span>
            </div>
        </div>
        <div class="card-footer bg-white d-flex gap-2">
            <a th:href="@{/students}" class="btn btn-secondary">&larr; Quay lại</a>
            <a th:href="@{/students/{id}/edit(id=${student.id})}" class="btn btn-warning">Sửa</a>
        </div>
    </div>
</section>
</body>
</html>
