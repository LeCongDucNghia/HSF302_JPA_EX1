<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title th:text="${student.id == null} ? #{form.title.new} : #{form.title.edit}">Form sinh viên</title>
</head>
<body>
<section layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h4 class="mb-0"
                        th:text="${student.id == null} ? #{form.title.new}
                                 : #{form.title.edit} + ': ' + ${student.studentCode}">
                        Thêm sinh viên mới
                    </h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/students/save}" th:object="${student}" method="post" novalidate>
                        <input type="hidden" th:field="*{id}">

                        <!-- Khối tổng hợp lỗi -->
                        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                            <strong th:text="#{form.error.summary}">Vui lòng sửa các lỗi sau:</strong>
                            <ul class="mb-0">
                                <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Lỗi</li>
                            </ul>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="studentCode" class="form-label">
                                    <span th:text="#{form.label.code}">Mã sinh viên</span> <span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control" placeholder="VD: SE180001"
                                       th:field="*{studentCode}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('studentCode')}"
                                     th:errors="*{studentCode}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="fullName" class="form-label">
                                    <span th:text="#{form.label.name}">Họ tên</span> <span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control"
                                       th:field="*{fullName}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}"
                                     th:errors="*{fullName}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="email" class="form-label">
                                    <span th:text="#{form.label.email}">Email</span> <span class="text-danger">*</span>
                                </label>
                                <input type="email" class="form-control"
                                       th:field="*{email}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                     th:errors="*{email}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="dateOfBirth" class="form-label">
                                    <span th:text="#{form.label.dob}">Ngày sinh</span> <span class="text-danger">*</span>
                                </label>
                                <input type="date" class="form-control"
                                       th:field="*{dateOfBirth}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('dateOfBirth')}"
                                     th:errors="*{dateOfBirth}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="gpa" class="form-label">
                                    <span th:text="#{form.label.gpa}">GPA (0 - 10)</span> <span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control" placeholder="VD: 8.5"
                                       th:field="*{gpa}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('gpa')}"
                                     th:errors="*{gpa}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="major" class="form-label">
                                    <span th:text="#{form.label.major}">Ngành</span> <span class="text-danger">*</span>
                                </label>
                                <select class="form-select" th:field="*{major}" th:errorclass="is-invalid">
                                    <option value="" th:text="#{form.select.major}">-- Chọn ngành --</option>
                                    <option th:each="m : ${majors}"
                                            th:value="${m.key}"
                                            th:text="|${m.key} - ${m.value}|">SE - Kỹ thuật phần mềm</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('major')}"
                                     th:errors="*{major}"></div>
                            </div>

                            <div class="col-12">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" th:field="*{active}">
                                    <label class="form-check-label" th:for="${#ids.prev('active')}"
                                           th:text="#{form.label.active}">Đang học</label>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4 d-flex gap-2">
                            <button type="submit" class="btn btn-primary"
                                    th:text="*{id == null} ? #{form.btn.create} : #{form.btn.update}">Lưu</button>
                            <a th:href="@{/students}" class="btn btn-secondary" th:text="#{form.btn.cancel}">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
