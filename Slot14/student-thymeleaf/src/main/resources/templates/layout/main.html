<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">Student Manager</title>

    <!-- Đường dẫn Bootstrap offline chuẩn trong thư mục static của bạn -->
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/students}">Student Manager</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/students}"
                       th:classappend="${activeMenu == 'list'} ? 'active'"
                       th:text="#{menu.list}">Danh sách</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/students/new}"
                       th:classappend="${activeMenu == 'new'} ? 'active'"
                       th:text="#{menu.new}">Thêm mới</a>
                </li>

                <!-- Dropdown chuyển đổi ngôn ngữ -->
                <li class="nav-item dropdown ms-lg-3">
                    <button class="btn btn-sm btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        🌐 <span th:text="#{menu.lang}">Ngôn ngữ</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li><a class="dropdown-item" th:href="@{''(lang='vi')}">🇻🇳 Tiếng Việt</a></li>
                        <li><a class="dropdown-item" th:href="@{''(lang='en')}">🇬🇧 English</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-4 flex-grow-1">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}">Thành công</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}">Lỗi</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <section layout:fragment="content"></section>
</main>

<footer class="bg-dark text-white-50 text-center py-3 mt-auto">
    &copy; <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> HSF302 – Student Manager
</footer>

<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
