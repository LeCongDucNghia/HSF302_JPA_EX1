spring.application.name=student-thymeleaf
server.port=8080

# ===== SQL Server =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=StudentDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# ===== i18n / Messages =====
spring.messages.fallback-to-system-locale=false
# 1. B\u1EAFt bu\u1ED9c Spring \u0111\u1ECDc file messages b\u1EB1ng UTF-8
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# 2. \u0110\u1EA3m b\u1EA3o to\u00E0n b\u1ED9 request/response HTTP (khi render & submit form) \u0111\u1EC1u d\u00F9ng UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
# 3. \u0110\u1EA3m b\u1EA3o Thymeleaf render UTF-8
spring.thymeleaf.encoding=UTF-8
