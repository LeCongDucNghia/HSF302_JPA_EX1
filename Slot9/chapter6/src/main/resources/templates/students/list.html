<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Danh sách sinh viên</title>
</head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people-fill me-2"></i>Danh sách sinh viên</h2>
        <a th:href="@{/students/create}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Thêm sinh viên
        </a>
    </div>

    <!-- Tìm kiếm: GET /students?keyword=... (giữ nguyên size & sort hiện tại) -->
    <form th:action="@{/students}" method="get" class="row g-2 mb-3">
        <input type="hidden" name="size" th:value="${studentPage.size}"/>
        <input type="hidden" name="sort" th:value="${sortField + ',' + sortDir}"/>
        <div class="col-md-5 col-lg-4">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control"
                   placeholder="Tìm theo tên hoặc email..."/>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary"><i class="bi bi-search me-1"></i>Tìm kiếm</button>
            <a th:if="${!keyword.isEmpty()}" th:href="@{/students}" class="btn btn-outline-secondary">Xóa bộ lọc</a>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">

            <!-- Trường hợp rỗng -->
            <div th:if="${#lists.isEmpty(students)}" class="text-center p-5 text-muted">
                <i class="bi bi-inbox display-4"></i>
                <p class="mt-2" th:text="${keyword.isEmpty()} ? 'Chưa có sinh viên nào.' : 'Không có sinh viên khớp với từ khóa.'">Chưa có sinh viên nào.</p>
                <a th:if="${keyword.isEmpty()}" th:href="@{/students/create}" class="btn btn-outline-primary">Thêm ngay</a>
            </div>

            <!-- Bảng dữ liệu -->
            <table th:unless="${#lists.isEmpty(students)}" class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>#</th>
                    <th th:replace="~{fragments/sort :: sortable('id', 'ID')}"></th>
                    <th th:replace="~{fragments/sort :: sortable('name', 'Họ tên')}"></th>
                    <th th:replace="~{fragments/sort :: sortable('email', 'Email')}"></th>
                    <th th:replace="~{fragments/sort :: sortable('age', 'Tuổi')}"></th>
                    <th th:replace="~{fragments/sort :: sortable('major.name', 'Chuyên ngành')}"></th>
                    <th th:replace="~{fragments/sort :: sortable('gpa', 'GPA')}"></th>
                    <th class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="student, stat : ${students}">
                    <td th:text="${studentPage.number * studentPage.size + stat.count}">1</td>
                    <td th:text="${student.id}">1</td>
                    <td>
                        <a th:href="@{/students/{id}(id=${student.id})}"
                           th:text="${student.name}"
                           class="text-decoration-none fw-semibold">Tên</a>
                    </td>
                    <td th:text="${student.email}">email</td>
                    <td th:text="${student.age}">20</td>
                    <td>
                        <span class="badge bg-secondary"
                              th:text="${student.major.code}"
                              th:title="${student.major.name}">CNTT</span>
                    </td>
                    <td>
                        <span th:classappend="${student.gpa >= 3.5} ? 'gpa-high' :
                                              (${student.gpa >= 2.5} ? 'gpa-mid' : 'gpa-low')"
                              th:text="${#numbers.formatDecimal(student.gpa, 1, 1)}">3.5</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/students/{id}(id=${student.id})}"
                           class="btn btn-sm btn-outline-info me-1" title="Chi tiết">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:href="@{/students/{id}/edit(id=${student.id})}"
                           class="btn btn-sm btn-outline-warning me-1" title="Sửa">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/students/{id}/delete(id=${student.id})}"
                              method="post" class="d-inline"
                              th:data-name="${student.name}"
                              onsubmit="return confirm('Xóa sinh viên ' + this.dataset.name + '?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:unless="${#lists.isEmpty(students)}" class="d-flex justify-content-between align-items-center mt-2">
        <small class="text-muted">
            Hiển thị <strong th:text="${#lists.size(students)}">0</strong> /
            <strong th:text="${studentPage.totalElements}">0</strong> sinh viên
        </small>
    </div>

    <!-- Thanh phân trang (giữ keyword, size, sort khi chuyển trang) -->
    <nav th:if="${studentPage.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${studentPage.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/students(page=${studentPage.number - 1}, size=${studentPage.size}, sort=${sortField + ',' + sortDir}, keyword=${keyword})}">Trước</a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, studentPage.totalPages - 1)}"
                th:classappend="${i == studentPage.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/students(page=${i}, size=${studentPage.size}, sort=${sortField + ',' + sortDir}, keyword=${keyword})}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${studentPage.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/students(page=${studentPage.number + 1}, size=${studentPage.size}, sort=${sortField + ',' + sortDir}, keyword=${keyword})}">Sau</a>
            </li>
        </ul>
    </nav>

</section>
</body>
</html>
